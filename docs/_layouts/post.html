---
layout: default
---
<article class="page">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← All posts</a>
  <h1 style="margin-top:18px">{{ page.title }}</h1>
  <div class="meta">
    {{ page.date | date: "%B %-d, %Y" }}
    {%- if page.tags.size > 0 %} · {% for tag in page.tags %}<a href="{{ '/topics/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>{% unless forloop.last %} / {% endunless %}{% endfor %}{% endif -%}
  </div>
  <div class="page-content">
    {{ content }}
  </div>
</article>
